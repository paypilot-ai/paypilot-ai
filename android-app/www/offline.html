<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PayPilot AI</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #060c18; color: #e6edf7;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: 32px 24px; box-sizing: border-box; }
  .mark { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 24px;
    background: linear-gradient(135deg, #0f5fe8, #1a6fff 55%, #00d4ff);
    display: grid; place-items: center; font-weight: 800; font-size: 34px; color: #fff; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0 0 28px; color: #8fa3bf; line-height: 1.5; max-width: 320px; }
  button { background: linear-gradient(135deg, #0f5fe8, #1a6fff); color: #fff; border: 0;
    border-radius: 12px; padding: 14px 32px; font-size: 16px; font-weight: 700; }
</style>
</head>
<body>
<main>
  <div class="mark">P</div>
  <h1>You're offline</h1>
  <p>PayPilot AI needs an internet connection for live coaching. Check your connection and try again.</p>
  <button onclick="location.href='https://paypilotai.live'">Try again</button>
</main>
</body>
</html>
